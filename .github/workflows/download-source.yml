name: Download page source verification
on:
  pull_request:
    branches: [main]
    paths: ["download/**", ".github/workflows/download-source.yml"]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check download/app.js
      - run: node download/download-regression.cjs
