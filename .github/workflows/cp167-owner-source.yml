name: CP167 Owner source verification
on:
  push:
    branches:
      - checkpoint167-owner-ci-integration-20261008
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: npm ci --prefix scripts/checkpoint166 --ignore-scripts --no-audit --no-fund
      - run: node scripts/checkpoint166/owner-web.cjs
