name: Owner source verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check props-control.js
      - run: npm ci --prefix scripts/checkpoint166 --ignore-scripts --no-audit --no-fund
      - run: node scripts/checkpoint166/owner-web.cjs
      - run: node scripts/checkpoint169/props-control-test.cjs
