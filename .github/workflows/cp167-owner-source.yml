name: Owner source verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check props-control.js && node --check gift-control.js && node --check prop-visibility.js
      - run: npm ci --prefix scripts/checkpoint166 --ignore-scripts --no-audit --no-fund
      - run: node scripts/checkpoint166/owner-web.cjs
      - run: node scripts/checkpoint169/props-control-test.cjs
      - run: node --check salary-policy.js && node salary-policy.test.cjs
      - run: node prop-visibility.test.cjs
      - run: node gift-control.test.cjs && node gift-browser.test.cjs
      - run: npm ci --prefix tests/media-upload --ignore-scripts --no-audit --no-fund
      - run: node --check props-media-upload.js && node tests/media-upload.test.cjs
      - run: node --check emoji-control.js && node tests/emoji-upload.test.cjs
      - run: node --check banner-workspace.js && node tests/banner-workspace.test.cjs
      - run: node --check room-reward-appearance.js && node tests/room-banner-upload.test.cjs
      - run: node --check login-preferences.js && node tests/login-preferences.test.cjs
      - run: node tests/dialog-lifecycle.test.cjs app.js && node tests/dialog-lifecycle-independent.test.cjs app.js

